name: autohistory
services:
  postgres:
    image: postgres:17.9-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: autohistory
      POSTGRES_DB: autohistory
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autohistory -d autohistory"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: local
      options: {max-size: "10m", max-file: "14"}
  bot:
    image: autohistory:1.0.0
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://autohistory:${POSTGRES_PASSWORD}@postgres:5432/autohistory
      PDF_TMP_DIR: /var/lib/autohistory/reports
      DELETION_JOURNAL_DIR: /var/lib/autohistory/deletions
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - reports:/var/lib/autohistory/reports
      - ${DELETION_JOURNAL_HOST_DIR:-./backups/deletions}:/var/lib/autohistory/deletions
    read_only: true
    tmpfs: [/tmp:size=32m,mode=1777]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: local
      options: {max-size: "10m", max-file: "14"}
volumes:
  postgres_data:
  reports:
